    <section class="mt-6">
      <h2 class="mb-3" style="color: rgb(245, 245, 245); font-weight: 700; font-size: 20px;">Feedback</h2>
      <div class="rounded-xl p-6" style="background: rgb(22, 33, 62);">
        <p class="text-sm text-gray-300 mb-3">Have a suggestion or found a bug? Tell us &mdash; it goes straight to the owner.</p>
        <label for="feedback-text" class="sr-only">Your feedback</label>
        <textarea id="feedback-text" rows="3" maxlength="1000" placeholder="Your feedback..."
                  class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400" style="resize: none;"></textarea>
        <div class="flex justify-end mt-2">
          <button id="feedback-send" onclick="sendFeedback()" class="px-4 py-2 rounded-lg font-semibold hover:opacity-90"
                  style="background: #f59e0b; color: #1a1a2e; font-weight: 600; font-size: 15px;">Send feedback</button>
        </div>
        <p id="feedback-msg" class="text-sm mt-2 hidden"></p>

        <div class="mt-5 pt-4 border-t border-gray-700">
          <p class="text-xs text-gray-400 mb-2">Owner: enter the PIN to read submitted feedback.</p>
          <div class="flex items-center gap-2">
            <label for="feedback-pin" class="sr-only">Owner PIN</label>
            <input id="feedback-pin" type="password" inputmode="numeric" placeholder="PIN" maxlength="12"
                   class="w-24 border-2 border-gray-200 rounded-lg px-2 py-1 text-sm focus:outline-none focus:border-amber-400">
            <button onclick="loadFeedback()" class="px-3 py-1 text-sm rounded-lg font-semibold hover:opacity-90"
                    style="background: #22c55e; color: #0f172a; font-weight: 600;">View</button>
            <button onclick="clearFeedback()" class="px-3 py-1 text-sm rounded-lg font-semibold hover:opacity-90"
                    style="background: #ef4444; color: #ffffff; font-weight: 600;">Clear</button>
          </div>
          <div id="feedback-list" class="mt-3 text-sm text-gray-200"></div>
        </div>
      </div>
    </section>
