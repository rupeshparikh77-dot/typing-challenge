<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Typing Challenge</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .mono { font-family: 'Space Mono', monospace; }

    #sentence-display {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .char-pending   { color: #cbd5e1; }
    .char-correct   { color: #4ade80; }
    .char-incorrect { color: #ffffff; background: #ef4444; border-radius: 3px; }
    .char-current   { background: #f59e0b; color: #1a1a2e; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8" style="background: rgb(26, 26, 46);">
  <main class="max-w-3xl mx-auto">
    <header class="text-center mb-8">
      <h1 style="color: rgb(245, 245, 245); font-weight: 700; font-size: 32px;">Speed Typing Challenge</h1>
      <p class="mt-2" style="color: rgb(161, 161, 170); font-size: 16px;">Type fast. Type accurate. Climb the leaderboard.</p>
    </header>

    <section id="name-input-section" class="mb-6">
      <div class="rounded-xl p-6 text-center" style="background: rgb(22, 33, 62);">
        <h2 class="mb-3" style="color: rgb(245, 245, 245); font-weight: 700; font-size: 22px;">Enter your name</h2>
        <form id="name-form" class="flex flex-col sm:flex-row gap-2 max-w-sm mx-auto">
          <label for="startup-name" class="sr-only">Your name</label>
          <input id="startup-name" type="text" placeholder="Enter your name" maxlength="40"
                 class="flex-1 border-2 border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-400" required>
          <button type="submit" class="px-4 py-2 rounded-lg font-semibold hover:opacity-90"
                  style="background: rgb(245, 158, 11); color: rgb(26, 26, 46); font-weight: 700; font-size: 16px;">Continue</button>
        </form>
      </div>
    </section>

    <section id="difficulty-section" class="hidden mb-6">
      <div class="rounded-xl p-6 text-center" style="background: rgb(22, 33, 62);">
        <h2 class="mb-1" style="color: rgb(245, 245, 245); font-weight: 700; font-size: 22px;">Choose a difficulty</h2>
        <p class="mb-4" style="color: rgb(161, 161, 170); font-size: 14px;">Higher levels use longer passages and harder words.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-lg mx-auto">
          <button onclick="selectDifficulty('easy')" class="rounded-lg p-4 hover:opacity-90 transition text-left"
                  style="background: #22c55e; color: #0f172a;">
            <span style="font-size: 18px; font-weight: 700;">Easy</span><br>
            <span style="font-size: 13px;">1 short sentence &middot; simple words</span>
          </button>
          <button onclick="selectDifficulty('medium')" class="rounded-lg p-4 hover:opacity-90 transition text-left"
                  style="background: #f59e0b; color: #1a1a2e;">
            <span style="font-size: 18px; font-weight: 700;">Medium</span><br>
            <span style="font-size: 13px;">2 sentences &middot; everyday words</span>
          </button>
          <button onclick="selectDifficulty('hard')" class="rounded-lg p-4 hover:opacity-90 transition text-left"
                  style="background: #f97316; color: #ffffff;">
            <span style="font-size: 18px; font-weight: 700;">Hard</span><br>
            <span style="font-size: 13px;">3 sentences &middot; tougher words</span>
          </button>
          <button onclick="selectDifficulty('extreme')" class="rounded-lg p-4 hover:opacity-90 transition text-left"
                  style="background: #7c3aed; color: #ffffff;">
            <span style="font-size: 18px; font-weight: 700;">EXTREME</span><br>
            <span style="font-size: 13px;">1 paragraph &middot; brutal words</span>
          </button>
        </div>
      </div>
    </section>

    <section id="typing-section" class="hidden rounded-xl p-6 mb-6" style="background: rgb(22, 33, 62);">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm text-gray-300">Difficulty: <span id="diff-label" class="font-semibold text-amber-400">Easy</span></span>
        <button id="change-diff-btn" class="text-sm underline hover:opacity-80" style="color: rgb(161,161,170);" onclick="changeDifficulty()">change</button>
      </div>
      <div id="sentence-display" class="mono text-lg leading-relaxed mb-4 min-h-[3rem]">
        <span class="text-gray-400 italic">Press Start to begin...</span>
      </div>
      <textarea id="type-input" rows="3"
             class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 mono text-lg focus:outline-none focus:border-amber-400 transition"
             style="resize: none;"
             disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="flex flex-wrap items-center justify-between gap-3 mt-4">
        <div class="flex flex-wrap gap-4 text-sm text-gray-200">
          <span class="font-medium">&#9201; <span id="timer">0.0s</span></span>
          <span class="font-medium">WPM: <span id="wpm-display">0</span></span>
          <span class="font-medium">Acc: <span id="acc-display">100%</span></span>
        </div>
        <div class="flex gap-2">
          <button id="start-btn" class="px-5 py-2 rounded-lg font-semibold transition hover:opacity-90" onclick="startGame()"
                  style="background: rgb(245, 158, 11); color: rgb(26, 26, 46); font-weight: 700; font-size: 16px;">Start</button>
          <button id="finish-btn" class="px-5 py-2 rounded-lg font-semibold transition hover:opacity-90 hidden" onclick="endGame()"
                  style="background: rgb(245, 158, 11); color: rgb(26, 26, 46); font-weight: 700; font-size: 16px;">Finish</button>
        </div>
      </div>
    </section>

    <section id="submit-section" class="hidden mb-6">
      <div class="rounded-xl p-6 text-center" style="background: rgb(22, 33, 62);">
        <h2 class="mb-2" style="color: rgb(245, 245, 245); font-weight: 700; font-size: 22px;">Nice work!</h2>
        <p id="result-stats" class="text-2xl font-bold mono mb-2 text-amber-400"></p>
        <p id="submit-msg" class="text-sm mt-2"></p>
        <button id="retry-btn" class="hidden mt-3 px-4 py-2 rounded-lg font-semibold hover:opacity-90"
                style="background: rgb(34, 197, 94); color: rgb(255, 255, 255); font-weight: 600; font-size: 16px;"
                onclick="submitScore()">Save score</button>
      </div>
    </section>

    <section>
      <h2 class="mb-3" style="color: rgb(245, 245, 245); font-weight: 700; font-size: 20px;">Leaderboard</h2>
      <div class="rounded-xl overflow-hidden" style="background: rgb(22, 33, 62);">
        <table class="w-full text-sm text-gray-200">
          <thead>
            <tr class="border-b border-gray-700">
              <th class="text-left px-4 py-3 font-semibold">#</th>
              <th class="text-left px-4 py-3 font-semibold">Player</th>
              <th class="text-left px-4 py-3 font-semibold">Level</th>
              <th class="text-right px-4 py-3 font-semibold">WPM</th>
              <th class="text-right px-4 py-3 font-semibold">Accuracy</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <tr><td colspan="5" class="px-4 py-6 text-center text-gray-400">No scores yet</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API = '/api/scores';

    const easySentences = [
      "The cat sat on the soft warm mat.",
      "A big red dog ran to the park.",
      "We can go for a walk in the sun.",
      "The kids like to play with the ball.",
      "I see a bird up in the tall tree.",
      "Mom made a cake for the party."
    ];

    const mediumSentences = [
      "The morning train was crowded with tired commuters heading downtown.",
      "She carefully placed the fragile vase on the wooden shelf.",
      "Our team finished the project a few days before the deadline.",
      "The recipe called for fresh basil, garlic, and a pinch of salt.",
      "He jogged along the river while listening to his favourite podcast.",
      "The museum exhibit featured paintings from the early modern period."
    ];

    const hardSentences = [
      "The ubiquitous bureaucracy exacerbated the entrepreneur's frustration considerably.",
      "Her meticulous analysis revealed several conspicuous discrepancies in the ledger.",
      "The philosopher articulated a nuanced argument concerning epistemological certainty.",
      "An unprecedented confluence of circumstances precipitated the institution's collapse.",
      "The negotiators sought a pragmatic compromise amid conflicting ideological positions.",
      "Conscientious stewardship of finite resources necessitates rigorous long-term planning."
    ];

    const extremeParagraphs = [
      "The indefatigable lexicographer, confronted with an antediluvian manuscript of inscrutable provenance, meticulously deciphered its labyrinthine orthography, whereupon the erstwhile incomprehensible glyphs unveiled a perspicacious treatise on the quintessential ephemerality of human endeavour.",
      "Notwithstanding the pusillanimous vacillations of the erstwhile committee, the magnanimous benefactor promulgated an unequivocal proclamation, thereby precipitating a paradigmatic metamorphosis whose ramifications reverberated throughout the beleaguered bureaucracy.",
      "Amidst the cacophonous kerfuffle of the interminable symposium, the sesquipedalian orator expounded upon abstruse metaphysical conundrums with such grandiloquent perspicacity that his flabbergasted interlocutors were rendered utterly nonplussed."
    ];

    const diffNames = { easy: 'Easy', medium: 'Medium', hard: 'Hard', extreme: 'EXTREME' };

    let playerName = '';
    let difficulty = '';
    let currentSentence = '';
    let startTime = null;
    let timerInterval = null;
    let gameActive = false;
    let allData = [];
    let lastWpm = 0;
    let lastAcc = 0;

    const input = document.getElementById('type-input');
    const display = document.getElementById('sentence-display');
    const timerEl = document.getElementById('timer');
    const wpmEl = document.getElementById('wpm-display');
    const accEl = document.getElementById('acc-display');

    document.getElementById('name-form').addEventListener('submit', (e) => {
      e.preventDefault();
      playerName = document.getElementById('startup-name').value.trim();
      if (!playerName) return;
      document.getElementById('name-input-section').classList.add('hidden');
      document.getElementById('difficulty-section').classList.remove('hidden');
    });

    function pickOne(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function pickSome(arr, n) {
      const copy = arr.slice();
      const out = [];
      for (let i = 0; i < n && copy.length; i++) {
        out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
      }
      return out;
    }

    function generateText(diff) {
      switch (diff) {
        case 'easy':    return pickOne(easySentences);
        case 'medium':  return pickSome(mediumSentences, 2).join(' ');
        case 'hard':    return pickSome(hardSentences, 3).join(' ');
        case 'extreme': return pickOne(extremeParagraphs);
        default:        return pickOne(easySentences);
      }
    }

    function selectDifficulty(level) {
      difficulty = level;
      document.getElementById('diff-label').textContent = diffNames[level] || level;
      document.getElementById('difficulty-section').classList.add('hidden');
      document.getElementById('submit-section').classList.add('hidden');
      document.getElementById('typing-section').classList.remove('hidden');
      display.innerHTML = '<span class="text-gray-400 italic">Press Start to begin...</span>';
    }

    function changeDifficulty() {
      if (gameActive) {
        gameActive = false;
        clearInterval(timerInterval);
      }
      input.disabled = true;
      document.getElementById('typing-section').classList.add('hidden');
      document.getElementById('submit-section').classList.add('hidden');
      document.getElementById('difficulty-section').classList.remove('hidden');
    }

    function startGame() {
      if (!playerName) {
        document.getElementById('name-input-section').classList.remove('hidden');
        return;
      }
      if (!difficulty) {
        document.getElementById('difficulty-section').classList.remove('hidden');
        return;
      }
      currentSentence = generateText(difficulty);
      input.value = '';
      input.disabled = false;
      input.focus();
      gameActive = true;
      startTime = Date.now();
      document.getElementById('submit-section').classList.add('hidden');
      document.getElementById('start-btn').classList.add('hidden');
      document.getElementById('finish-btn').classList.remove('hidden');
      renderSentence();
      timerInterval = setInterval(updateTimer, 100);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function renderSentence() {
      const typed = input.value;
      let html = '';
      for (let i = 0; i < currentSentence.length; i++) {
        const ch = escapeHtml(currentSentence[i]);
        if (i < typed.length) {
          html += typed[i] === currentSentence[i]
            ? `<span class="char-correct">${ch}</span>`
            : `<span class="char-incorrect">${ch}</span>`;
        } else if (i === typed.length) {
          html += `<span class="char-current">${ch}</span>`;
        } else {
          html += `<span class="char-pending">${ch}</span>`;
        }
      }
      display.innerHTML = html;
    }

    function updateTimer() {
      const elapsed = (Date.now() - startTime) / 1000;
      timerEl.textContent = elapsed.toFixed(1) + 's';
      const words = input.value.trim().split(/\s+/).filter(Boolean).length;
      const mins = elapsed / 60;
      wpmEl.textContent = mins > 0 ? Math.round(words / mins) : 0;
    }

    function endGame() {
      if (!gameActive) return;
      gameActive = false;
      clearInterval(timerInterval);
      input.disabled = true;
      document.getElementById('start-btn').classList.remove('hidden');
      document.getElementById('finish-btn').classList.add('hidden');

      const elapsed = (Date.now() - startTime) / 1000;
      const words = currentSentence.split(/\s+/).length;
      lastWpm = elapsed > 0 ? Math.round(words / (elapsed / 60)) : 0;

      let correct = 0;
      for (let i = 0; i < currentSentence.length; i++) {
        if (input.value[i] === currentSentence[i]) correct++;
      }
      lastAcc = Math.round((correct / currentSentence.length) * 100);

      wpmEl.textContent = lastWpm;
      accEl.textContent = lastAcc + '%';
      document.getElementById('result-stats').textContent = `${lastWpm} WPM \u00B7 ${lastAcc}% accuracy \u00B7 ${diffNames[difficulty] || difficulty}`;
      document.getElementById('submit-section').classList.remove('hidden');

      submitScore();
    }

    input.addEventListener('input', () => {
      if (!gameActive) return;
      renderSentence();
      if (input.value.length >= currentSentence.length) {
        endGame();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') e.preventDefault();
    });

    async function fetchLeaderboard(attempt = 0) {
      try {
        const res = await fetch(`${API}?limit=10`);
        if (!res.ok) throw new Error('bad status ' + res.status);
        allData = await res.json();
        renderLeaderboard();
      } catch (err) {
        if (attempt < 3) {
          setTimeout(() => fetchLeaderboard(attempt + 1), 1500);
          return;
        }
        console.error(err);
        allData = [];
        renderLeaderboard();
      }
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboard-body');
      if (!allData.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-6 text-center text-gray-400">No scores yet</td></tr>';
        return;
      }
      tbody.innerHTML = allData.map((r, i) => {
        const level = { easy: 'Easy', medium: 'Medium', hard: 'Hard', extreme: 'EXTREME' }[r.difficulty] || '\u2014';
        return `
        <tr class="border-b border-gray-700">
          <td class="px-4 py-2 font-medium">${i + 1}</td>
          <td class="px-4 py-2">${escapeHtml(r.player_name || 'Anon')}</td>
          <td class="px-4 py-2">${level}</td>
          <td class="px-4 py-2 text-right font-bold mono">${r.wpm}</td>
          <td class="px-4 py-2 text-right">${r.accuracy}%</td>
        </tr>`;
      }).join('');
    }

    async function submitScore() {
      const msg = document.getElementById('submit-msg');
      const retry = document.getElementById('retry-btn');
      retry.classList.add('hidden');
      msg.textContent = 'Saving your score...';
      msg.className = 'text-sm mt-2 text-gray-300';
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ player_name: playerName || 'Anon', wpm: lastWpm, accuracy: lastAcc, difficulty: difficulty })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          msg.textContent = '\u2713 Score saved to the leaderboard!';
          msg.className = 'text-sm mt-2 text-green-400';
          await fetchLeaderboard();
        } else {
          msg.textContent = (data.error || 'Could not save score.') + ' Tap "Save score" to try again.';
          msg.className = 'text-sm mt-2 text-red-400';
          retry.classList.remove('hidden');
        }
      } catch (err) {
        msg.textContent = 'Network error \u2014 tap "Save score" to try again.';
        msg.className = 'text-sm mt-2 text-red-400';
        retry.classList.remove('hidden');
      }
    }

    fetchLeaderboard();
  </script>
</body>
</html>
